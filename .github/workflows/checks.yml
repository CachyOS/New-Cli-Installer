name: Checks

on:
  push:
    paths-ignore:
    - '.github/ISSUE_TEMPLATE/**'
    - 'LICENSE'
    branches:
    - master
  pull_request:
    branches:
    - master

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpp-linter:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      AR: llvm-ar
      CC: clang
      CXX: clang++
      NM: llvm-nm
      RANLIB: llvm-ranlib
    steps:
      - name: install deps
        run: |
          pacman -Syu --noconfirm cmake pkg-config ninja clang mold llvm git
        shell: bash

      - uses: actions/checkout@v7

      - name: Configure CMake
        run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=Debug

      - name: Run clang-tidy
        # non-blocking until the baseline is clean
        continue-on-error: true
        run: |
          clang-tidy --version
          git ls-files 'src/*.cpp' 'gucc/*.cpp' 'installer-lib/*.cpp' \
            | xargs -r run-clang-tidy -p ${{github.workspace}}/build -quiet
        shell: bash

  check_clang_format:
    name: "Check C++ style"
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: install deps
        run: |
          pacman -Syu --noconfirm clang git
        shell: bash

      - uses: actions/checkout@v7

      - name: Run clang-format
        run: |
          clang-format --version
          git ls-files 'src/*.cpp' 'src/*.hpp' 'src/*.h' ':!src/subprocess.h' \
            | xargs -r clang-format --dry-run --Werror
        shell: bash
